<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>PC28 实战预测</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { min-height: 100vh; }
  body {
    background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 25%, #2d1b4e 50%, #1a2a4e 75%, #0a0e27 100%);
    background-attachment: fixed;
    color:#d1d9e6;
    font-family:-apple-system,'Segoe UI',sans-serif;
    padding:14px;
    min-height:100vh;
    position: relative;
  }
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: -1;
    background: linear-gradient(135deg, #667eea, #764ba2, #f093fb, #f5576c, #4facfe, #00f2fe, #43e97b, #38f9d7, #fa709a, #fee140);
    background-size: 400% 400%;
    opacity: 0.10;
    animation: bgShift 22s ease infinite;
    pointer-events: none;
  }
  @keyframes bgShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .container { max-width:560px; margin:0 auto; position: relative; z-index: 1; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .header h1 {
    font-size:18px; font-weight:800;
    background: linear-gradient(90deg, #6ee7b7, #3b82f6, #a78bfa, #f472b6, #fbbf24, #6ee7b7);
    background-size: 300% 100%;
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text;
    animation: titleGrad 8s linear infinite;
  }
  @keyframes titleGrad { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }
  .header .status { font-size:11px; color:#6ee7b7; }
  .header .status.err { color:#f87171; }
  .header .status.loading { color:#fbbf24; }
  .card {
    background: linear-gradient(135deg, rgba(30,40,70,0.72), rgba(60,30,90,0.62), rgba(20,40,70,0.72));
    background-size: 200% 200%;
    border: 1px solid rgba(110,180,255,0.14);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.04);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .card h2 { font-size:12px; color:#a5b4fc; margin-bottom:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; }
  .last-draw { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .last-draw .period { font-size:12px; color:#94a3b8; }
  .last-draw .combo-tag {
    font-size:22px; font-weight:800;
    background: linear-gradient(90deg, #fbbf24, #f472b6, #a78bfa);
    background-size: 200% 100%;
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .last-draw .meta { font-size:11px; color:#64748b; }
  .main-pick {
    background: linear-gradient(135deg, #0f172a 0%, #1a2a4a 30%, #3d1b5e 60%, #0f3a4a 100%);
    background-size: 250% 250%;
    animation: cardShift 12s ease infinite;
    border: 2px solid transparent;
    border-image: linear-gradient(135deg, #6ee7b7, #3b82f6, #a78bfa, #f472b6, #6ee7b7) 1;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 14px;
    box-shadow: 0 0 40px rgba(110,231,183,0.15), 0 0 80px rgba(167,139,250,0.08);
    position: relative;
    overflow: hidden;
  }
  .main-pick::after {
    content: '';
    position: absolute;
    top: -50%; left: -50%; right: -50%; bottom: -50%;
    background: radial-gradient(circle at 30% 30%, rgba(110,231,183,0.08), transparent 50%),
                radial-gradient(circle at 70% 70%, rgba(167,139,250,0.08), transparent 50%);
    pointer-events: none;
  }
  @keyframes cardShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
  .main-pick .tag {
    font-size:11px; letter-spacing:1.5px; margin-bottom:10px; font-weight:700;
    background: linear-gradient(90deg, #6ee7b7, #3b82f6, #a78bfa);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text; position: relative; z-index: 1;
  }
  .main-pick .exclude-label { font-size:13px; color:#94a3b8; margin-bottom:4px; position: relative; z-index: 1; }
  .main-pick .exclude {
    font-size:42px; font-weight:900;
    background: linear-gradient(90deg, #f87171, #f472b6, #fb923c);
    background-size: 200% 100%;
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text;
    line-height:1.1; margin-bottom:14px; letter-spacing:2px;
    position: relative; z-index: 1;
  }
  .main-pick .buy-label { font-size:13px; color:#94a3b8; margin-bottom:4px; position: relative; z-index: 1; }
  .main-pick .buy {
    font-size:24px; font-weight:800; letter-spacing:2px;
    background: linear-gradient(90deg, #6ee7b7, #34d399, #10b981);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text; position: relative; z-index: 1;
  }
  .main-pick .reason {
    font-size:11px; color:#94a3b8; margin-top:14px; padding-top:12px;
    border-top:1px dashed rgba(148,163,184,0.18);
    position: relative; z-index: 1;
  }
  .main-pick .reason strong { color:#cbd5e1; }
  .main-pick .next-period {
    font-size:12px; margin-top:6px; position: relative; z-index: 1;
    background: linear-gradient(90deg, #60a5fa, #a78bfa);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text; font-weight: 600;
  }
  /* 投票分布 */
  .vote-dist { display:flex; gap:6px; margin-top:12px; position: relative; z-index: 1; flex-wrap:wrap; }
  .vote-item { flex:1; min-width:70px; background: rgba(15,23,42,0.55); border-radius: 8px; padding: 8px 6px; text-align:center; border:1px solid rgba(148,163,184,0.1); }
  .vote-item.top { border-color: rgba(248,113,113,0.5); background: rgba(248,113,113,0.08); }
  .vote-item .vk { font-size:10px; color:#94a3b8; margin-bottom:2px; }
  .vote-item .vv { font-size:14px; font-weight:700; color:#cbd5e1; }
  .vote-item.top .vv { color:#f87171; }
  .vote-item .vs { font-size:9px; color:#64748b; }

  .algo-list { display:flex; flex-direction:column; gap:6px; }
  .algo-item {
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 12px;
    background: linear-gradient(135deg, rgba(15,23,42,0.7), rgba(30,25,60,0.65));
    border: 1px solid rgba(148,163,184,0.06);
    border-radius:8px; font-size:12px;
    transition: 0.2s;
  }
  .algo-item .name { color:#cbd5e1; flex:1; display:flex; align-items:center; gap:6px; }
  .algo-item .new-tag { font-size:9px; padding:1px 6px; background: linear-gradient(90deg, rgba(139,92,246,0.25), rgba(167,139,250,0.25)); color:#c4b5fd; border-radius:8px; border: 1px solid rgba(167,139,250,0.3); }
  .algo-item .pred {
    font-weight:700; min-width:50px; text-align:center;
    background: linear-gradient(90deg, #f87171, #fb923c);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .algo-item .rate { color:#94a3b8; font-size:11px; min-width:50px; text-align:right; }
  .algo-item.active {
    background: linear-gradient(135deg, rgba(110,231,183,0.10), rgba(59,130,246,0.08));
    border: 1px solid rgba(110,231,183,0.4);
    box-shadow: 0 0 20px rgba(110,231,183,0.10);
  }
  .algo-item.active .name { color:#6ee7b7; font-weight:700; }
  .algo-item.active .name::before { content:'🏆 '; }

  .history-list { max-height:260px; overflow-y:auto; }
  .history-list::-webkit-scrollbar { width:4px; }
  .history-list::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #3b82f6, #a78bfa); border-radius:2px; }
  .history-item {
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 4px;
    border-bottom:1px solid rgba(30,41,59,0.5);
    font-size:12px;
  }
  .history-item:last-child { border-bottom:none; }
  .history-item .p { color:#94a3b8; min-width:90px; }
  .history-item .pred { min-width:40px; text-align:center; color:#f87171; }
  .history-item .actual { color:#cbd5e1; min-width:40px; text-align:center; }
  .history-item .result { font-weight:700; min-width:50px; text-align:right; }
  .history-item .result.hit { color:#6ee7b7; }
  .history-item .result.miss { color:#f87171; }
  .history-item .result.wait { color:#fbbf24; }

  button {
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: #fff; border: none;
    padding: 10px 20px; border-radius: 8px;
    font-size: 13px; font-weight: 600;
    cursor: pointer; transition: 0.2s;
    box-shadow: 0 2px 10px rgba(59,130,246,0.28);
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(124,58,237,0.45); }
  button:disabled { background: linear-gradient(135deg, #334155, #1e293b); color:#64748b; cursor:not-allowed; transform: none; box-shadow: none; }
  button.green { background: linear-gradient(135deg, #059669, #10b981, #34d399); box-shadow: 0 2px 10px rgba(16,185,129,0.32); }
  button.green:hover { box-shadow: 0 4px 16px rgba(16,185,129,0.55); }
  button.secondary { background: transparent; border: 1px solid rgba(148,163,184,0.25); color: #94a3b8; box-shadow: none; }
  button.secondary:hover { background: rgba(148,163,184,0.08); transform: none; box-shadow: none; color: #cbd5e1; }

  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .hint { font-size:11px; color:#64748b; margin-top:6px; line-height:1.6; }

  .onboard { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background: rgba(10,14,39,0.95); z-index:100; padding:24px; align-items:center; justify-content:center; backdrop-filter: blur(8px); }
  .onboard.show { display:flex; }
  .onboard-box {
    max-width:420px;
    background: linear-gradient(135deg, #1a1e3e, #2d1b4e, #1a2a4e);
    border: 1px solid rgba(167,139,250,0.25);
    border-radius:16px; padding:24px; text-align:center;
    box-shadow: 0 0 60px rgba(167,139,250,0.15);
  }
  .onboard-box h2 {
    font-size:16px; margin-bottom:10px; font-weight: 700;
    background: linear-gradient(90deg, #6ee7b7, #a78bfa, #f472b6);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .onboard-box p { color:#94a3b8; font-size:13px; line-height:1.7; margin-bottom:16px; }

  .spin { display:inline-block; width:12px; height:12px; border:2px solid #64748b; border-top-color:#6ee7b7; border-radius:50%; animation:sp 0.8s linear infinite; vertical-align:middle; }
  @keyframes sp { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>⚡ PC28 实战预测</h1>
    <span class="status" id="status"><span class="spin"></span> 加载中...</span>
  </div>

  <div class="card">
    <h2>最新开奖</h2>
    <div class="last-draw">
      <div>
        <div class="period" id="lastPeriod">--</div>
        <div class="combo-tag" id="lastCombo">--</div>
      </div>
      <div>
        <div class="meta" id="lastNums">--</div>
        <div class="meta" id="lastSum">--</div>
      </div>
    </div>
    <div class="hint" id="dataInfo">历史数据：-- 期</div>
  </div>

  <div class="main-pick" id="mainPick" style="display:none">
    <div class="tag">🎯 本期推荐 · 加权投票</div>
    <div class="exclude-label">建议排除</div>
    <div class="exclude" id="excludeCombo">--</div>
    <div class="buy-label">购买这三个组合</div>
    <div class="buy" id="buyCombos">--</div>
    <div class="vote-dist" id="voteDist"></div>
    <div class="reason" id="reason">--</div>
    <div class="next-period" id="nextPeriod">--</div>
  </div>

  <div class="card" id="algoCard" style="display:none">
    <h2>13 算法明细（按权重排序）</h2>
    <div class="algo-list" id="algoList"></div>
  </div>

  <div class="card" id="historyCard" style="display:none">
    <h2>预测记录 <span style="float:right;font-weight:400;text-transform:none;color:#64748b" id="historyAcc"></span></h2>
    <div class="history-list" id="historyList"></div>
  </div>

  <div class="row" style="margin-top:14px">
    <button class="green" id="refreshBtn" onclick="refresh()">🔄 刷新数据</button>
    <button class="secondary" onclick="openOnboard()">📁 更换历史数据</button>
    <button class="secondary" onclick="clearHistory()">🗑 清空记录</button>
  </div>
</div>

<div class="onboard" id="onboard">
  <div class="onboard-box">
    <h2>首次使用 · 上传历史数据</h2>
    <p>本工具需要一份历史数据作为算法的"记忆库"。请上传你已有的完整CSV文件（含16列）。<br><br>上传后会保存在浏览器本地，下次打开无需再传。</p>
    <input type="file" id="onboardFile" accept=".csv,.txt" style="display:none">
    <button class="green" style="width:100%;margin-bottom:8px" onclick="document.getElementById('onboardFile').click()">📁 选择CSV文件</button>
    <div class="hint" style="text-align:center">也可以直接点关闭，用 API 的 80 期数据临时预览</div>
    <button class="secondary" style="width:100%;margin-top:10px" onclick="closeOnboard()">稍后再说</button>
  </div>
</div>

<script>
const COMBOS = ['大单','大双','小单','小双'];
const W = 30;
const WARMUP = 200;
const STORAGE_KEY = 'pc28_history_v1';
const RECORD_KEY = 'pc28_records_v1';

const state = { rows: [], records: [] };

function openOnboard() { document.getElementById('onboard').classList.add('show'); }
function closeOnboard() { document.getElementById('onboard').classList.remove('show'); }

document.getElementById('onboardFile').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const ok = parseAndSaveCSV(ev.target.result);
    if (ok) { closeOnboard(); setStatus('数据已保存，正在预测...', 'loading'); setTimeout(refresh, 300); }
  };
  reader.readAsText(f, 'UTF-8');
});

function parseAndSaveCSV(text) {
  const lines = text.replace(/\r/g,'').split('\n');
  const rows = [];
  let hdr = false;
  for (const line of lines) {
    const t = line.trim();
    if (!t) continue;
    if (!hdr) { hdr = true; if (t.includes('期号') && t.includes('组合')) continue; }
    const c = t.split(',');
    if (c.length < 9) continue;
    const combo = c[8].trim();
    if (!COMBOS.includes(combo)) continue;
    rows.push({
      period: c[0].replace(/^\uFEFF/,'').trim(),
      combo,
      sum: parseInt(c[4]) || 0,
      xingtai: (c[9]||'').trim(),
      bianlu:  (c[10]||'').trim(),
      longhu:  (c[11]||'').trim(),
    });
  }
  if (rows.length < 300) { setStatus('❌ 有效数据不足300期', 'err'); return false; }
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(rows)); state.rows = rows; return true; }
  catch (e) { setStatus('❌ 存储失败（数据太大）', 'err'); return false; }
}

function loadStoredRows() {
  try { const s = localStorage.getItem(STORAGE_KEY); return s ? JSON.parse(s) : []; } catch { return []; }
}
function loadRecords() {
  try { const s = localStorage.getItem(RECORD_KEY); return s ? JSON.parse(s) : []; } catch { return []; }
}
function saveRecords() { try { localStorage.setItem(RECORD_KEY, JSON.stringify(state.records.slice(-200))); } catch {} }
function clearHistory() {
  if (!confirm('确定清空预测记录？（历史数据保留）')) return;
  state.records = []; localStorage.removeItem(RECORD_KEY); renderHistory();
}

async function fetchLatest() {
  try {
    const resp = await fetch('https://pc28.help/api/kj.json?nbr=80');
    const json = await resp.json();
    if (json.message !== 'success' || !json.data) throw new Error('API返回异常');
    const rows = [];
    json.data.forEach(item => {
      if (!COMBOS.includes(item.combination)) return;
      rows.push({ period: String(item.nbr), combo: item.combination, sum: parseInt(item.num) || 0, xingtai: '', bianlu: '', longhu: '' });
    });
    rows.sort((a,b) => parseInt(a.period) - parseInt(b.period));
    return rows;
  } catch (e) { console.error('API 拉取失败', e); return []; }
}

// =============================================================
// 13 算法
// =============================================================
function argmax(o){ let b=COMBOS[0],m=-Infinity; for(const k of COMBOS){ if(o[k]>m){m=o[k];b=k;} } return b; }
function argmin(o){ let b=COMBOS[0],m=Infinity; for(const k of COMBOS){ if(o[k]<m){m=o[k];b=k;} } return b; }

function algoFreq(rows, n) { if (n<50) return '小单'; const f={大单:0,大双:0,小单:0,小双:0}; for(let i=n-50;i<n;i++)f[rows[i].combo]++; return argmax(f); }
function algoTransfer(rows, n) { if (n<50) return '小单'; const last=rows[n-1].combo; const t={大单:0,大双:0,小单:0,小双:0}; for(let i=Math.max(1,n-200);i<n;i++) if(rows[i-1].combo===last) t[rows[i].combo]++; return argmin(t); }
function algoOmission(rows, n) { if (n<50) return '小单'; const o={}; for(const x of COMBOS){ let m=0; for(let i=n-1;i>=0;i--){ if(rows[i].combo===x) break; m++; } o[x]=m; } return argmin(o); }
function algoSimilar(rows, n) {
  if (n<100) return '小单';
  const P=3; const key=rows.slice(n-P,n).map(r=>r.combo).join('|');
  const dist={大单:0,大双:0,小单:0,小双:0}; let samples=0;
  for(let i=P;i+W<=n;i++){ if(rows.slice(i-P,i).map(r=>r.combo).join('|')===key){ for(let j=i;j<i+W;j++) dist[rows[j].combo]++; samples++; } }
  if(samples<5) return rows[n-1].combo;
  return argmin(dist);
}
function algoIce(rows, n) { if (n<100) return '小单'; const s={大单:0,大双:0,小单:0,小双:0}; for(let i=n-20;i<n;i++)s[rows[i].combo]++; const l={大单:0,大双:0,小单:0,小双:0}; for(let i=n-100;i<n;i++)l[rows[i].combo]++; const sc={}; for(const x of COMBOS) sc[x]=s[x]*2+l[x]; return argmin(sc); }
function algoAntiStreak(rows, n) { if (n<10) return '小单'; return rows[n-1].combo; }
function algoBayes(rows, n) {
  if (n<150) return '小单';
  const last=rows[n-1].combo;
  const f50={大单:0,大双:0,小单:0,小双:0}; for(let i=n-50;i<n;i++)f50[rows[i].combo]++;
  const t={大单:0,大双:0,小单:0,小双:0}; for(let i=Math.max(1,n-200);i<n;i++) if(rows[i-1].combo===last) t[rows[i].combo]++;
  const o={}; for(const x of COMBOS){ let m=0; for(let i=n-1;i>=0;i--){ if(rows[i].combo===x) break; m++; } o[x]=m; }
  const f10={大单:0,大双:0,小单:0,小双:0}; for(let i=n-10;i<n;i++)f10[rows[i].combo]++;
  const mF50=Math.max(...Object.values(f50))||1, mT=Math.max(...Object.values(t))||1, mO=Math.max(...Object.values(o))||1, mF10=Math.max(...Object.values(f10))||1;
  const sc={}; for(const x of COMBOS) sc[x]=0.30*(f50[x]/mF50)+0.30*(1-t[x]/mT)+0.20*(1-o[x]/mO)+0.20*(f10[x]/mF10);
  return argmax(sc);
}
function algoTrend(rows, n) { if (n<50) return '小单'; let big=0; for(let i=n-30;i<n;i++) if(rows[i].combo.startsWith('大')) big++; return big/30>0.5?'大单':'小单'; }
function algoSumEMA(rows, n) { if (n<50) return '小单'; const alpha=0.25; let ema=rows[n-50].sum; for(let i=n-49;i<n;i++) ema=alpha*rows[i].sum+(1-alpha)*ema; const centers={大单:19,大双:20,小单:9,小双:10}; let maxD=-1,worst='小单'; for(const c of COMBOS){ const d=Math.abs(centers[c]-ema); if(d>maxD){maxD=d;worst=c;} } return worst; }
function algoMarkovMulti(rows, n) {
  if (n<100) return '小单';
  const last=rows[n-1].combo, last2=rows[n-2].combo, last3=rows[n-3].combo;
  const t1={大单:0,大双:0,小单:0,小双:0}; for(let i=1;i<n;i++) if(rows[i-1].combo===last) t1[rows[i].combo]++;
  const t2={大单:0,大双:0,小单:0,小双:0}; for(let i=2;i<n;i++) if(rows[i-2].combo===last2 && rows[i-1].combo===last) t2[rows[i].combo]++;
  const t3={大单:0,大双:0,小单:0,小双:0}; for(let i=3;i<n;i++) if(rows[i-3].combo===last3 && rows[i-2].combo===last2 && rows[i-1].combo===last) t3[rows[i].combo]++;
  const sc={}; for(const x of COMBOS) sc[x]=0.2*t1[x]+0.5*t2[x]+0.3*t3[x];
  return argmin(sc);
}
function algoTripleResonance(rows, n) {
  if (n<100) return '小单';
  const cur=rows[n-1];
  const d3={大单:0,大双:0,小单:0,小双:0}; let cnt3=0;
  for(let i=1;i<n;i++){ const p=rows[i-1]; if(p.xingtai===cur.xingtai && p.bianlu===cur.bianlu && p.longhu===cur.longhu){ d3[rows[i].combo]++; cnt3++; } }
  if(cnt3>=30) return argmin(d3);
  const d2={大单:0,大双:0,小单:0,小双:0}; let cnt2=0;
  for(let i=1;i<n;i++){ const p=rows[i-1]; if(p.xingtai===cur.xingtai && p.bianlu===cur.bianlu){ d2[rows[i].combo]++; cnt2++; } }
  if(cnt2>=30) return argmin(d2);
  const d1={大单:0,大双:0,小单:0,小双:0}; for(let i=1;i<n;i++){ if(rows[i-1].xingtai===cur.xingtai) d1[rows[i].combo]++; }
  return argmin(d1);
}
function algoMeta(rows, n) {
  if (n<100) return '小单';
  const f={大单:0,大双:0,小单:0,小双:0}; for(let i=n-30;i<n;i++)f[rows[i].combo]++;
  const last=rows[n-1].combo;
  const t={大单:0,大双:0,小单:0,小双:0}; for(let i=Math.max(1,n-150);i<n;i++) if(rows[i-1].combo===last) t[rows[i].combo]++;
  const o={}; for(const x of COMBOS){ let m=0; for(let i=n-1;i>=0;i--){ if(rows[i].combo===x) break; m++; } o[x]=m; }
  const mF=Math.max(...Object.values(f))||1, mT=Math.max(...Object.values(t))||1, mO=Math.max(...Object.values(o))||1;
  const sc={}; for(const x of COMBOS) sc[x]=0.4*(f[x]/mF)+0.3*(1-t[x]/mT)+0.3*(1-o[x]/mO);
  return argmax(sc);
}
function algoEditDistance(rows, n) {
  if (n<200) return '小单';
  const TPL=5; const template=rows.slice(n-TPL,n).map(r=>r.combo);
  const candidates=[];
  for(let i=TPL;i+W<=n;i++){ let d=0; for(let k=0;k<TPL;k++){ if(rows[i-TPL+k].combo!==template[k]){ d++; if(d>1) break; } } if(d<=1) candidates.push(i); }
  if(candidates.length<5) return rows[n-1].combo;
  const dist={大单:0,大双:0,小单:0,小双:0}; for(const i of candidates){ for(let j=i;j<i+W && j<n;j++) dist[rows[j].combo]++; }
  return argmin(dist);
}

const ALGO_LIST = [
  { id:'freq', name:'频率反向', fn: algoFreq, isNew: false },
  { id:'transfer', name:'转移冷门', fn: algoTransfer, isNew: false },
  { id:'omission', name:'遗漏反向', fn: algoOmission, isNew: false },
  { id:'similar', name:'相似窗口', fn: algoSimilar, isNew: false },
  { id:'ice', name:'冰期追踪', fn: algoIce, isNew: false },
  { id:'antiStreak', name:'反连出', fn: algoAntiStreak, isNew: false },
  { id:'bayes', name:'贝叶斯融合', fn: algoBayes, isNew: false },
  { id:'trend', name:'趋势顺势', fn: algoTrend, isNew: false },
  { id:'sumEMA', name:'和值EMA预测', fn: algoSumEMA, isNew: true },
  { id:'markovMulti', name:'多阶马尔可夫', fn: algoMarkovMulti, isNew: true },
  { id:'triple', name:'三列共振', fn: algoTripleResonance, isNew: true },
  { id:'meta', name:'元学习器', fn: algoMeta, isNew: true },
  { id:'editDist', name:'编辑距离匹配', fn: algoEditDistance, isNew: true },
];

// =============================================================
// 核心：计算每个算法在 [start, end) 区间的命中率
// =============================================================
function computeRates(rows, hitMatrix, start, end) {
  const rates = new Array(ALGO_LIST.length).fill(0);
  for (let a = 0; a < ALGO_LIST.length; a++) {
    let h = 0, cnt = 0;
    for (let j = start; j < end; j++) { h += hitMatrix[a][j]; cnt++; }
    rates[a] = cnt > 0 ? h / cnt : 0;
  }
  return rates;
}

// =============================================================
// 加权投票预测（核心升级）
// =============================================================
function weightedVote(rows, n, hitMatrix, evalUpTo) {
  const A = ALGO_LIST.length;
  // 多窗口命中率（用 evalUpTo 之前的已开奖数据，避免未来信息）
  const start10 = Math.max(WARMUP, evalUpTo - 10);
  const start30 = Math.max(WARMUP, evalUpTo - 30);
  const start100 = Math.max(WARMUP, evalUpTo - 100);

  const rate10 = computeRates(rows, hitMatrix, start10, evalUpTo);
  const rate30 = computeRates(rows, hitMatrix, start30, evalUpTo);
  const rate100 = computeRates(rows, hitMatrix, start100, evalUpTo);

  // 综合权重 = 0.35×短期 + 0.40×中期 + 0.25×长期
  const weights = new Array(A).fill(0);
  for (let a = 0; a < A; a++) {
    weights[a] = rate10[a] * 0.35 + rate30[a] * 0.40 + rate100[a] * 0.25;
    // 表现太差的算法直接禁言（<60%）
    if (weights[a] < 0.55) weights[a] = 0;
  }

  // 加权投票
  const votes = { 大单:0, 大双:0, 小单:0, 小双:0 };
  const voteCounts = { 大单:0, 大双:0, 小单:0, 小双:0 };
  for (let a = 0; a < A; a++) {
    if (weights[a] <= 0) continue;
    const pred = ALGO_LIST[a].fn(rows, n);
    votes[pred] += weights[a];
    voteCounts[pred] += 1;
  }

  // 排除得票最高的
  let exclude = COMBOS[0], maxV = -Infinity;
  for (const c of COMBOS) if (votes[c] > maxV) { maxV = votes[c]; exclude = c; }

  return { exclude, votes, voteCounts, weights, rate10, rate30, rate100 };
}

// =============================================================
// 主刷新流程
// =============================================================
async function refresh() {
  setStatus('<span class="spin"></span> 加载中...', 'loading');

  let rows = loadStoredRows();
  if (rows.length < 300) { setStatus('需要上传历史数据', 'err'); openOnboard(); return; }

  setStatus('<span class="spin"></span> 拉取最新开奖...', 'loading');
  const latest = await fetchLatest();
  if (latest.length > 0) {
    const lastStoredPeriod = parseInt(rows[rows.length-1].period);
    const merged = rows.filter(r => parseInt(r.period) <= lastStoredPeriod);
    const existingMap = new Map(merged.map(r => [r.period, r]));
    latest.forEach(r => existingMap.set(r.period, r));
    rows = Array.from(existingMap.values()).sort((a,b) => parseInt(a.period) - parseInt(b.period));
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(rows)); } catch {}
  }

  if (rows.length < 300) { setStatus('数据不足300期', 'err'); return; }

  state.rows = rows;
  const n = rows.length;

  const last = rows[n-1];
  document.getElementById('lastPeriod').textContent = `第 ${last.period} 期`;
  document.getElementById('lastCombo').textContent = last.combo;
  document.getElementById('lastNums').textContent = `和值 ${last.sum}`;
  document.getElementById('lastSum').textContent = last.xingtai ? `形态 ${last.xingtai}` : '';
  document.getElementById('dataInfo').textContent = `历史数据：${n} 期 · 范围 ${rows[0].period} ~ ${last.period}`;

  // 计算最近200期的每期每算法命中
  const calcStart = Math.max(WARMUP, n - 200);
  const hitMatrix = [];
  for (let a = 0; a < ALGO_LIST.length; a++) hitMatrix.push(new Uint8Array(n));
  for (let a = 0; a < ALGO_LIST.length; a++) {
    const fn = ALGO_LIST[a].fn;
    for (let i = calcStart; i < n; i++) {
      const pred = fn(rows, i);
      hitMatrix[a][i] = (rows[i].combo !== pred) ? 1 : 0;
    }
  }

  // 加权投票预测下一期
  const result = weightedVote(rows, n, hitMatrix, n);
  const robotExclude = result.exclude;

  // 显示
  document.getElementById('mainPick').style.display = 'block';
  document.getElementById('excludeCombo').textContent = robotExclude;
  const buy = COMBOS.filter(x => x !== robotExclude);
  document.getElementById('buyCombos').textContent = buy.join(' · ');

  // 投票分布显示
  const totalVote = Object.values(result.votes).reduce((a,b) => a+b, 0) || 1;
  const distHtml = COMBOS.map(c => {
    const pct = (result.votes[c] / totalVote * 100).toFixed(0);
    const isTop = c === robotExclude;
    return `<div class="vote-item ${isTop?'top':''}">
      <div class="vk">${c}</div>
      <div class="vv">${result.votes[c].toFixed(2)}</div>
      <div class="vs">${result.voteCounts[c]}票 · ${pct}%</div>
    </div>`;
  }).join('');
  document.getElementById('voteDist').innerHTML = distHtml;

  // 找出权重最高的算法（用于展示"最强算法"）
  let bestA = 0, bestW = -1;
  for (let a = 0; a < ALGO_LIST.length; a++) if (result.weights[a] > bestW) { bestW = result.weights[a]; bestA = a; }

  document.getElementById('reason').innerHTML =
    `加权投票：<strong>${COMBOS.filter(x => x !== robotExclude).length}</strong> 个组合参与 · 最强算法 <strong>${ALGO_LIST[bestA].name}</strong> (权重 ${(result.weights[bestA]*100).toFixed(1)}) · 得票最高 <strong>${robotExclude}</strong>`;

  const nextPeriod = (parseInt(last.period) + 1).toString();
  document.getElementById('nextPeriod').textContent = `预测目标：第 ${nextPeriod} 期`;

  // 算法明细
  document.getElementById('algoCard').style.display = 'block';
  const nextPreds = ALGO_LIST.map(a => a.fn(rows, n));
  const indexed = ALGO_LIST.map((a, i) => ({
    name: a.name, isNew: a.isNew, pred: nextPreds[i],
    weight: result.weights[i], rate10: result.rate10[i],
    idx: i, active: nextPreds[i] === robotExclude
  })).sort((a,b) => b.weight - a.weight);
  document.getElementById('algoList').innerHTML = indexed.map(x => {
    const rateCls = x.rate10 >= 0.85 ? '#6ee7b7' : x.rate10 >= 0.75 ? '#fbbf24' : '#f87171';
    return `<div class="algo-item ${x.active ? 'active' : ''}">
      <span class="name">${x.name}${x.isNew ? ' <span class="new-tag">新</span>' : ''}</span>
      <span class="pred">${x.pred}</span>
      <span class="rate" style="color:${rateCls}">${(x.rate10*100).toFixed(0)}% · ${x.weight.toFixed(2)}</span>
    </div>`;
  }).join('');

  // 补录 + 记录本次
  for (const rec of state.records) {
    if (rec.actual === null) {
      const found = rows.find(r => r.period === rec.period);
      if (found) rec.actual = found.combo;
    }
  }

  const recordPeriods = new Set(state.records.map(r => r.period));
  let startIdx = n;
  if (state.records.length > 0) {
    const maxRecorded = Math.max(...state.records.map(r => parseInt(r.period)));
    for (let i = WARMUP + 30; i < n; i++) {
      if (parseInt(rows[i].period) > maxRecorded) { startIdx = i; break; }
    }
  }
  const minStart = Math.max(WARMUP + 30, n - 100);
  if (startIdx < minStart) startIdx = minStart;

  for (let i = startIdx; i < n; i++) {
    const p = rows[i].period;
    if (recordPeriods.has(p)) continue;

    // 补录该期：用该期之前的数据计算每个算法的近期表现，然后加权投票
    // 计算该期之前的命中矩阵（简化：只算最近60期的命中率）
    const algoRecentHit = new Array(ALGO_LIST.length).fill(0);
    const algoRecentCnt = new Array(ALGO_LIST.length).fill(0);
    const startEval = Math.max(WARMUP, i - 30);
    for (let a = 0; a < ALGO_LIST.length; a++) {
      const fn = ALGO_LIST[a].fn;
      let h = 0, cnt = 0;
      for (let j = startEval; j < i; j++) {
        const pred = fn(rows, j);
        if (rows[j].combo !== pred) h++;
        cnt++;
      }
      algoRecentHit[a] = h; algoRecentCnt[a] = cnt;
    }
    // 用近30期命中率做权重，加权投票
    const votes = { 大单:0, 大双:0, 小单:0, 小双:0 };
    for (let a = 0; a < ALGO_LIST.length; a++) {
      const rate = algoRecentCnt[a] > 0 ? algoRecentHit[a] / algoRecentCnt[a] : 0;
      if (rate < 0.55) continue;
      const pred = ALGO_LIST[a].fn(rows, i);
      votes[pred] += rate;
    }
    let pred = COMBOS[0], maxV = -Infinity;
    for (const c of COMBOS) if (votes[c] > maxV) { maxV = votes[c]; pred = c; }

    state.records.push({ period: p, predict: pred, actual: rows[i].combo, time: Date.now() });
    recordPeriods.add(p);
  }

  if (!recordPeriods.has(nextPeriod)) {
    state.records.push({ period: nextPeriod, predict: robotExclude, actual: null, time: Date.now() });
  }

  saveRecords();
  renderHistory();
  setStatus('✅ 已更新', 'ok');
}

function renderHistory() {
  state.records = loadRecords();
  const list = document.getElementById('historyList');
  const card = document.getElementById('historyCard');
  if (state.records.length === 0) { card.style.display = 'none'; return; }
  card.style.display = 'block';
  const sorted = state.records.slice().sort((a,b) => parseInt(b.period) - parseInt(a.period)).slice(0, 30);
  let valid = 0, hit = 0;
  list.innerHTML = sorted.map(r => {
    let resultHtml = '';
    if (r.actual === null) { resultHtml = '<span class="result wait">⏳ 待开</span>'; }
    else {
      valid++;
      const isHit = (r.actual !== r.predict);
      if (isHit) hit++;
      resultHtml = isHit ? '<span class="result hit">✓ 中</span>' : '<span class="result miss">✗ 未中</span>';
    }
    return `<div class="history-item">
      <span class="p">${r.period}</span>
      <span class="pred">排${r.predict}</span>
      <span class="actual">${r.actual || '--'}</span>
      ${resultHtml}
    </div>`;
  }).join('');
  const acc = valid > 0 ? (hit / valid * 100).toFixed(1) : '--';
  document.getElementById('historyAcc').textContent = valid > 0 ? `${hit}/${valid} · ${acc}%` : '--';
}

function setStatus(msg, cls) { const s = document.getElementById('status'); s.innerHTML = msg; s.className = 'status ' + (cls || ''); }

state.records = loadRecords();

window.addEventListener('load', () => {
  const stored = loadStoredRows();
  if (stored.length < 300) { openOnboard(); setStatus('需要上传历史数据', 'err'); }
  else { refresh(); }
});

setInterval(() => { if (state.rows.length >= 300) refresh(); }, 60000);

document.getElementById('refreshBtn').addEventListener('click', refresh);
</script>
